services:
  postgres:
      image: postgres:15
      container_name: postgres
      restart: always
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
#        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "${POSTGRES_PORT}:5432"
      volumes:
        - ./infrastructure/postgres/init-db:/docker-entrypoint-initdb.d
        - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" #
      - "9001:9001" #
    volumes:
      - minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST}:5432/${KEYCLOAK_POSTGRES_DB}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}

      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080" #
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - postgres

  frontend:
    build:
      context: frontend/client
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/client:/app
#      - /app/node_modules
      - frontend_node_modules:/app/node_modules
    depends_on:
      - keycloak
#      - file-service
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

#  file-service:
#    build:
#      context: .
#      dockerfile: backend/file-service/Dockerfile
#    env_file:
#      - .env
#    image: file-service:local
#    container_name: file-service
#    depends_on:
#      - postgres
#      - minio
#      - keycloak
#    ports:
#      - "${FILE_SERVICE_PORT}:8081"
#
#  directory-service:
#    build:
#      context: .
#      dockerfile: backend/directory-service/Dockerfile
#    env_file:
#      - .env
#    image: directory-service:local
#    container_name: directory-service
#    depends_on:
#      - postgres
#    ports:
#      - "${DIRECTORY_SERVICE_PORT}:8082"
#
#  user-service:
#    build:
#      context: .
#      dockerfile: backend/user-service/Dockerfile
#    env_file:
#      - .env
#    image: user-service:local
#    container_name: user-service
#    depends_on:
#      - postgres
#    ports:
#      - "${USER_SERVICE_PORT}:8083"

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
  pgadmin-data:
